shell /opt/homebrew/bin/fish
editor /opt/homebrew/bin/zed --wait

include current-theme.conf
font_family family='Cartograph CF' postscript_name=CartographCF-Regular
window_padding_width 24
hide_window_decorations titlebar-only
macos_show_window_title_in none
macos_quit_when_last_window_closed yes
cursor_trail 1000
initial_window_width 600
initial_window_height 600

kitty_mod command
map kitty_mod+f launch --type=overlay --stdin-source=@screen_scrollback /opt/homebrew/bin/fzf --no-sort --no-mouse --exact -i
map kitty_mod+w close_window
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+slash next_layout
